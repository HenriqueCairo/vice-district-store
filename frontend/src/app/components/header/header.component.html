<header class="header" [class.scrolled]="scrolled">
  <div class="wrap bar">
    <a routerLink="/" class="brand" (click)="closeMenu()">
      <img src="assets/logo.jpg" alt="Vice District" class="logo" />
      <span class="brand-name">Vice District</span>
    </a>

    <nav class="nav" [class.open]="menuOpen">
      <a routerLink="/" fragment="catalogo" (click)="closeMenu()">Catálogo</a>
      <a routerLink="/" fragment="como-comprar" (click)="closeMenu()">Como comprar</a>
      <a [href]="whatsapp.getGenericLink()" target="_blank" rel="noopener" class="nav-whatsapp" (click)="closeMenu()">
        Falar no WhatsApp
      </a>
    </nav>

    <button class="burger" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen" aria-label="Abrir menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
