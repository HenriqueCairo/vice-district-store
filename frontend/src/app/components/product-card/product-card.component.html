<article
  #card
  class="card cut-tl"
  [style.transform]="transform"
  (mousemove)="onMouseMove($event)"
  (mouseleave)="resetTransform()"
>
  <a [routerLink]="['/produto', product.slug]" class="media">
    <img [src]="product.images[0]" [alt]="product.name" loading="lazy" />
    <span class="badge-featured" *ngIf="product.featured">Destaque</span>
    <span class="badge-discount" *ngIf="discountPercent">-{{ discountPercent }}%</span>
  </a>

  <div class="body">
    <span class="category">{{ product.category }}</span>
    <h3 class="name">{{ product.name }}</h3>

    <div class="price-row">
      <span class="price">R$ {{ product.price.toFixed(2).replace('.', ',') }}</span>
      <span class="old-price" *ngIf="product.oldPrice">R$ {{ product.oldPrice.toFixed(2).replace('.', ',') }}</span>
    </div>

    <p class="low-stock" *ngIf="lowStock">Últimas unidades</p>

    <a [routerLink]="['/produto', product.slug]" class="btn btn-primary details-btn">Ver detalhes</a>
  </div>
</article>
