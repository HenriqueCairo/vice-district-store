<section id="catalogo" class="section">
  <div class="wrap">
    <div class="section-head">
      <h2>Catálogo</h2>
      <p class="count" *ngIf="!loading && !error">{{ filtered.length }} peças disponíveis agora</p>
    </div>

    <div class="chips" *ngIf="!loading && !error && categories.length > 1">
      <button
        *ngFor="let cat of categories"
        class="chip"
        [class.active]="activeCategory === cat"
        (click)="setCategory(cat)"
      >
        {{ cat }}
      </button>
    </div>

    <div class="grid" *ngIf="!loading && !error">
      <app-product-card *ngFor="let p of filtered; trackBy: trackById" [product]="p"></app-product-card>
    </div>

    <div class="grid" *ngIf="loading">
      <div class="skeleton-card skeleton" *ngFor="let n of [1,2,3,4,5,6,7,8]"></div>
    </div>

    <p class="error" *ngIf="error">
      Não consegui carregar os produtos agora. Confira se o back-end (Next.js) está rodando em
      <code>{{ ' ' }}npm run dev</code>.
    </p>
  </div>
</section>
